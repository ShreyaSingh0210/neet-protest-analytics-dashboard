<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NEET Protest Analytics Platform 2026</title>
  <link rel="icon" href="{{ url_for('static', filename='img/logo.svg') }}">

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap utilities -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- AOS -->
  <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

  <!-- Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <!-- App CSS -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">

  {% block head_extra %}{% endblock %}
</head>
<body class="theme-dark">
  <!-- Mouse glow -->
  <div id="cursor-glow" aria-hidden="true"></div>

  <!-- Loading overlay (used for AI scanning / page transitions) -->
  <div id="loading-overlay" class="loading-overlay" aria-hidden="true">
    <div class="loader-inner card-glass">
      <div id="lottie-scanner" class="lottie-scanner"></div>
      <div class="loader-text">
        <div class="loader-title">AI Scanning</div>
        <div class="loader-sub">Preparing Command Centre...</div>
      </div>
    </div>
  </div>

  {% block body %}{% endblock %}

  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/countup.js@2.0.8/dist/countUp.min.js"></script>
  <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.0/tsparticles.min.js"></script>
  <script src="https://unpkg.com/lottie-web@5.9.4/build/player/lottie.min.js"></script>

  <!-- App scripts -->
  <script src="{{ url_for('static', filename='js/main.js') }}"></script>
  {% block body_extra %}{% endblock %}
  <script>
    AOS.init({ once: true, duration: 700, easing: 'ease-out-cubic' });
  </script>
</body>
</html>
