<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Protest Analytics Platform 2026</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
font-family:Segoe UI,Arial,sans-serif;
background:linear-gradient(135deg,#020617,#0f172a,#111827);
color:#fff;overflow:hidden;
}
.hero{
height:100vh;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
position:relative;
}
.hero:before{
content:"";
position:absolute;
width:700px;height:700px;
background:radial-gradient(circle,#06b6d455,transparent 70%);
animation:pulse 5s infinite;
}
@keyframes pulse{
0%{transform:scale(.8);opacity:.4}
50%{transform:scale(1.1);opacity:1}
100%{transform:scale(.8);opacity:.4}
}
.glass{
position:relative;
z-index:2;
background:rgba(255,255,255,.06);
backdrop-filter:blur(16px);
padding:50px;
border-radius:24px;
border:1px solid rgba(255,255,255,.12);
box-shadow:0 0 40px rgba(0,212,255,.2);
max-width:900px;
}
h1{
font-size:3.8rem;
font-weight:800;
background:linear-gradient(90deg,#38bdf8,#22d3ee,#818cf8);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}
.lead{font-size:1.3rem;color:#d1d5db;margin:20px 0}
.badge-box{
display:flex;
justify-content:center;
gap:12px;
flex-wrap:wrap;
margin:25px 0;
}
.badge{
padding:10px 18px;
font-size:1rem;
border-radius:50px;
background:#1e293b;
}
.btn-enter{
padding:15px 35px;
font-size:1.2rem;
border-radius:50px;
background:linear-gradient(90deg,#2563eb,#06b6d4);
border:none;
color:#fff;
text-decoration:none;
transition:.3s;
}
.btn-enter:hover{transform:translateY(-3px) scale(1.03)}
.loader{
position:fixed;
inset:0;
background:#020617;
display:flex;
justify-content:center;
align-items:center;
font-size:2rem;
font-weight:700;
z-index:9999;
animation:hide 2.5s forwards;
}
@keyframes hide{
80%{opacity:1}
100%{opacity:0;visibility:hidden}
}
</style>
</head>
<body>

<div class="loader">🔍 Scanning NEET Protest Data...</div>

<section class="hero">
<div class="glass">
<h1>NEET Protest Analytics Platform 2026</h1>
<p class="lead">
AI-powered protest intelligence dashboard built with Flask, Power BI, Selenium, Supabase and Google AI Studio.
</p>

<div class="badge-box">
<span class="badge">📊 Live Analytics</span>
<span class="badge">🤖 AI Insights</span>
<span class="badge">📍 State-wise Trends</span>
<span class="badge">⚡ Real-time Monitoring</span>
</div>

<a href="/dashboard" class="btn-enter">Enter Command Centre →</a>
</div>
</section>

</body>
</html>
